<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 14px; opacity: 0.8; }
        .target-link {
            margin-top: 20px;
            display: inline-block;
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            word-break: break-all;
        }
        .target-link:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>正在跳转到下载页面...</h1>
        <p>如果页面没有自动跳转，请点击下方链接</p>
        <a id="targetLink" class="target-link" href="#">点击前往</a>
    </div>
    <script>
        // ==================== 修改这里的链接即可 ====================
        const TARGET_URL = "https://6a1ca1896dcd479db81ecc9b04e49cfe.app.workbuddy.link";
        // ==========================================================
        
        document.getElementById('targetLink').href = TARGET_URL;
        document.getElementById('targetLink').textContent = TARGET_URL;
        
        // 3秒后自动跳转
        setTimeout(() => {
            window.location.href = TARGET_URL;
        }, 1500);
    </script>
</body>
</html>
